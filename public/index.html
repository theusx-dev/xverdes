<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xverdes — Multiplayer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #00e676;
      margin-bottom: 20px;
    }
    .card {
      background: #202024;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #29292e;
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #a8a8b3;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #323238;
      background: #121214;
      color: #fff;
      font-size: 1rem;
    }
    button {
      background: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover {
      background: #00c853;
    }
    .btn-find {
      background: #e040fb;
      color: #fff;
      font-size: 1.1rem;
    }
    .btn-find:hover {
      background: #d500f9;
    }
    .btn-cancel {
      background: #ff5252;
      color: #fff;
    }
    .btn-cancel:hover {
      background: #ff1744;
    }
    .divider {
      text-align: center;
      margin: 15px 0;
      color: #737380;
      font-size: 0.85rem;
    }
    .hidden {
      display: none;
    }
    .game-area {
      text-align: center;
    }
    .click-btn {
      background: #2979ff;
      color: #fff;
      padding: 20px;
      font-size: 1.2rem;
      margin-top: 15px;
    }
    .click-btn:hover {
      background: #2962ff;
    }
    .summon-group {
      display: flex;
      gap: 10px;
    }
    .summon-btn {
      background: #ff9100;
      color: #000;
    }
    .summon-btn:hover {
      background: #ff6d00;
    }
    .status-bar {
      margin: 15px 0;
      padding: 10px;
      background: #121214;
      border-radius: 5px;
    }
    .searching-status {
      text-align: center;
      padding: 10px;
      background: #18181b;
      border-radius: 5px;
      margin-bottom: 15px;
      color: #e040fb;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🌪️ Xverdes Multiplayer</h1>

  <!-- TELA DE LOGIN / SALA -->
  <div id="setup-screen" class="card">
    <label for="username">Seu Nome:</label>
    <input type="text" id="username" placeholder="Ex: Jogador 1" value="Jogador">

    <!-- NOVO BOTAO PARA PROCURAR PARTIDA AUTOMATICA -->
    <button id="btn-find-match" class="btn-find">🔍 Achar Partida</button>

    <div id="searching-box" class="hidden">
      <div class="searching-status" id="searching-msg">Procurando oponente...</div>
      <button id="btn-cancel-search" class="btn-cancel">Cancelar Busca</button>
    </div>

    <div class="divider">OU ENTRE COM CÓDIGO DE SALA</div>

    <label for="room-id">Código da Sala:</label>
    <input type="text" id="room-id" placeholder="Ex: SALA123" value="SALA123">

    <button id="btn-join">Entrar na Sala</button>
  </div>

  <!-- TELA DE JOGO -->
  <div id="game-screen" class="card hidden game-area">
    <h2 id="room-title">Sala: -</h2>
    <p id="player-team">Time: -</p>
    
    <div class="status-bar">
      <p>Pontos: <strong id="points-val">0</strong></p>
      <p>Vida: <strong id="hp-val">100</strong></p>
    </div>

    <button id="btn-click" class="click-btn">⚡ CLICAR (+1 Ponto)</button>

    <h3 style="margin-top: 20px; margin-bottom: 10px;">Invocações</h3>
    <div class="summon-group">
      <button class="summon-btn" data-type="pequeno">Pequeno (25 pts)</button>
      <button class="summon-btn" data-type="medio">Médio (100 pts)</button>
      <button class="summon-btn" data-type="grande">Grande (300 pts)</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const setupScreen = document.getElementById("setup-screen");
    const gameScreen = document.getElementById("game-screen");

    const usernameInput = document.getElementById("username");
    const roomIdInput = document.getElementById("room-id");
    const btnJoin = document.getElementById("btn-join");

    const btnFindMatch = document.getElementById("btn-find-match");
    const btnCancelSearch = document.getElementById("btn-cancel-search");
    const searchingBox = document.getElementById("searching-box");
    const searchingMsg = document.getElementById("searching-msg");

    const roomTitle = document.getElementById("room-title");
    const playerTeam = document.getElementById("player-team");
    const pointsVal = document.getElementById("points-val");
    const hpVal = document.getElementById("hp-val");

    const btnClick = document.getElementById("btn-click");
    const summonBtns = document.querySelectorAll(".summon-btn");

    let myPlayerId = null;

    // ACHAR PARTIDA SEM CODIGO
    btnFindMatch.addEventListener("click", () => {
      const name = usernameInput.value.trim();
      socket.emit("find_match", { name });
    });

    btnCancelSearch.addEventListener("click", () => {
      socket.emit("cancel_search");
    });

    socket.on("queue_status", ({ inQueue, message }) => {
      if (inQueue) {
        btnFindMatch.classList.add("hidden");
        searchingBox.classList.remove("hidden");
        searchingMsg.innerText = message;
      } else {
        btnFindMatch.classList.remove("hidden");
        searchingBox.classList.add("hidden");
      }
    });

    // ENTRAR VIA CODIGO
    btnJoin.addEventListener("click", () => {
      const name = usernameInput.value.trim();
      const roomId = roomIdInput.value.trim();

      if (!roomId) return alert("Digite o código da sala.");

      socket.emit("join_room", { name, roomId, maxPerTeam: 1 });
    });

    socket.on("joined", ({ player, room }) => {
      myPlayerId = player.id;
      setupScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");

      roomTitle.innerText = `Sala: ${room.id}`;
      playerTeam.innerText = `Time: ${player.team}`;
    });

    socket.on("error_message", (msg) => {
      alert(msg);
    });

    btnClick.addEventListener("click", () => {
      socket.emit("click");
    });

    summonBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const type = btn.getAttribute("data-type");
        socket.emit("summon", { type });
      });
    });

    socket.on("players_update", (room) => {
      const me = room.players.find(p => p.id === myPlayerId);
      if (me) {
        pointsVal.innerText = me.points;
        hpVal.innerText = me.hp;
      }
    });

    socket.on("battle_end", ({ winnerText }) => {
      alert(`Fim de jogo! Vitória do ${winnerText}`);
    });
  </script>
</body>
</html>
