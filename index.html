<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xverdes — Multiplayer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06100d;color:#effff6;font-family:Arial,sans-serif;min-height:100vh}
header{padding:18px 28px;border-bottom:1px solid #234c3c;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900;letter-spacing:3px;color:#57ed9e}.online{color:#89b9a4}
.screen{max-width:1050px;margin:auto;padding:35px 20px}
.card{background:#0b2119;border:1px solid #2d624d;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0007}
h1{font-size:clamp(42px,7vw,72px);margin:5px 0}.muted{color:#9cbcaf}
input{width:100%;padding:15px;margin:8px 0;background:#07140f;color:white;border:1px solid #315f4d;border-radius:10px;font-size:16px}
button{padding:14px 18px;border:1px solid #438262;background:#123a2a;color:white;border-radius:11px;font-weight:900;cursor:pointer}
button:hover:not(:disabled){background:#1b573e;transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}
#lobby{max-width:480px;margin:70px auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arena{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:15px;align-items:center}
.player{text-align:center;padding:20px;border:1px solid #2d624d;border-radius:18px;background:#081812}
.name{font-size:21px;font-weight:900}.hp{height:16px;background:#172a22;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;width:100%;background:#5cf1a1;transition:.25s}
.points{font-size:24px;font-weight:900;color:#75ffb2}
#click{height:300px;border-radius:30px;border:2px dashed #3d8565;background:radial-gradient(circle,#153e2d,#07150f);font-size:30px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.small{font-size:13px;color:#91ad9f}
#feed{height:25px;text-align:center;color:#8bf5bb;margin:15px}
.tornado{position:fixed;pointer-events:none;font-size:var(--size);left:var(--x);top:var(--y);z-index:9;animation:spin 1s linear infinite,rise 2.5s ease-out forwards;filter:drop-shadow(0 0 22px #63ffac)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{to{opacity:0;transform:translateY(-230px) scale(1.5)}}
.hidden{display:none!important}
@media(max-width:750px){.arena{grid-template-columns:1fr}.player{padding:12px}#click{height:210px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">XVERDES</div><div class="online" id="status">● Offline</div></header>

<section id="lobby" class="card">
<h1>Xverdes</h1><p class="muted">Batalha de Tornados — Multiplayer</p>
<input id="name" placeholder="Seu nome" maxlength="18">
<input id="room" placeholder="Código da sala (ex.: VERDE)">
<div class="row">
<button id="create">Criar sala</button>
<button id="join">Entrar na sala</button>
</div>
<p class="small">Abra o jogo em dois computadores/navegadores e use o mesmo código.</p>
</section>

<section id="game" class="screen hidden">
<div class="arena">
<div class="player"><div class="name" id="p1name">Jogador 1</div><div class="hp"><div class="bar" id="p1hp"></div></div><div class="points"><span id="p1points">0</span> pts</div></div>
<div><div id="click">🖱️<br>Clique para ganhar pontos</div><div id="feed">Aguardando o adversário...</div></div>
<div class="player"><div class="name" id="p2name">Adversário</div><div class="hp"><div class="bar" id="p2hp"></div></div><div class="points"><span id="p2points">0</span> pts</div></div>
</div>
<div class="controls">
<button data-type="pequeno" data-cost="25">🌪️ Pequeno — 25</button>
<button data-type="medio" data-cost="100">🌪️ Médio — 100</button>
<button data-type="grande" data-cost="300">🌪️ Grande — 300</button>
</div>
<p class="small" style="text-align:center">Sala: <b id="roomLabel"></b> · Cada clique = 1 ponto · O servidor controla os pontos e danos.</p>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let me=null, state=[];
const $=id=>document.getElementById(id);
socket.on("connect",()=>{ $("status").textContent="● Conectado"; });
socket.on("disconnect",()=>{ $("status").textContent="● Desconectado"; });

function join(){
 const name=$("name").value.trim()||"Jogador";
 const room=$("room").value.trim().toUpperCase();
 socket.emit("join_room",{name,roomId:room});
}
$("create").onclick=()=>{ if(!$("room").value.trim()) $("room").value=Math.random().toString(36).slice(2,8).toUpperCase(); join(); };
$("join").onclick=join;

socket.on("joined",data=>{
 me=data.player;
 $("lobby").classList.add("hidden"); $("game").classList.remove("hidden");
 $("roomLabel").textContent=data.roomId;
 $("feed").textContent="Aguardando outro jogador...";
});
$("click").onclick=()=>socket.emit("click");

function render(list){
 state=list;
 const mine=list.find(p=>p.id===me?.id);
 const other=list.find(p=>p.id!==me?.id);
 if(mine) me={...me,...mine};
 const a=mine||list[0], b=other||list[1];
 if(a){$("p1name").textContent=a.name;$("p1points").textContent=a.points;$("p1hp").style.width=a.hp+"%";}
 if(b){$("p2name").textContent=b.name;$("p2points").textContent=b.points;$("p2hp").style.width=b.hp+"%";}
 else {$("p2name").textContent="Aguardando...";$("p2points").textContent="0";$("p2hp").style.width="100%";}
 document.querySelectorAll(".controls button").forEach(x=>x.disabled=!mine||mine.points<+x.dataset.cost||!b);
}
socket.on("room_state",d=>render(d.players));
socket.on("players_update",render);
socket.on("player_update",p=>{const i=state.findIndex(x=>x.id===p.id);if(i>=0)state[i]=p;render(state);});

document.querySelectorAll(".controls button").forEach(btn=>{
 btn.onclick=()=>socket.emit("summon",btn.dataset.type);
});
socket.on("battle_start",()=>$("feed").textContent="⚔️ BATALHA INICIADA! Clique e ataque!");
socket.on("error_message",m=>alert(m));

socket.on("tornado",t=>{
 const el=document.createElement("div");el.className="tornado";el.textContent="🌪️";
 el.style.setProperty("--size",t.size+"px");el.style.setProperty("--x",(25+Math.random()*50)+"vw");el.style.setProperty("--y",(35+Math.random()*30)+"vh");
 document.body.appendChild(el);setTimeout(()=>el.remove(),2500);
 $("feed").textContent=(t.attackerId===me?.id?"Você chamou ":"O adversário chamou ")+t.type+"!";
});
socket.on("battle_end",d=>{
 $("feed").textContent="🏆 "+d.winnerName+" venceu a batalha!";
 document.querySelectorAll(".controls button").forEach(x=>x.disabled=true);
});
</script>
</body>
</html>
