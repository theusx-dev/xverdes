<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xverdes — Multiplayer & Solo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06100d;color:#effff6;font-family:Arial,sans-serif;min-height:100vh}
header{padding:18px 28px;border-bottom:1px solid #234c3c;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900;letter-spacing:3px;color:#57ed9e}.online{color:#89b9a4}
.screen{max-width:1050px;margin:auto;padding:35px 20px}
.card{background:#0b2119;border:1px solid #2d624d;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0007}
h1{font-size:clamp(42px,7vw,72px);margin:5px 0}.muted{color:#9cbcaf}
input,select{width:100%;padding:15px;margin:8px 0;background:#07140f;color:white;border:1px solid #315f4d;border-radius:10px;font-size:16px}
button{padding:14px 18px;border:1px solid #438262;background:#123a2a;color:white;border-radius:11px;font-weight:900;cursor:pointer}
button:hover:not(:disabled){background:#1b573e;transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}
#lobby{max-width:520px;margin:50px auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-btn{background:#164230;margin-bottom:10px;width:100%}
.arena{display:grid;grid-template-columns:1.2fr 1.4fr 1.2fr;gap:15px;align-items:center}
.team-container{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto}
.player{text-align:center;padding:12px;border:1px solid #2d624d;border-radius:14px;background:#081812}
.name{font-size:16px;font-weight:900}.hp{height:12px;background:#172a22;border-radius:20px;overflow:hidden;margin:6px 0}.bar{height:100%;width:100%;background:#5cf1a1;transition:.25s}
.points{font-size:18px;font-weight:900;color:#75ffb2}
#click{height:250px;border-radius:30px;border:2px dashed #3d8565;background:radial-gradient(circle,#153e2d,#07150f);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.small{font-size:13px;color:#91ad9f}
#feed{height:25px;text-align:center;color:#8bf5bb;margin:15px}
.tornado{position:fixed;pointer-events:none;font-size:var(--size);left:var(--x);top:var(--y);z-index:9;animation:spin 1s linear infinite,rise 2.5s ease-out forwards}
.skin-default{filter:drop-shadow(0 0 22px #63ffac)}
.skin-galaxy{filter:drop-shadow(0 0 22px #a855f7) hue-rotate(180deg)}
.skin-emerald{filter:drop-shadow(0 0 22px #10b981) saturate(3)}
.skin-inferno{filter:drop-shadow(0 0 22px #ef4444) hue-rotate(280deg)}
.skin-gold{filter:drop-shadow(0 0 22px #eab308) sepia(1)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{to{opacity:0;transform:translateY(-230px) scale(1.5)}}
.hidden{display:none!important}
.inventory{background:#07140f;border:1px solid #315f4d;border-radius:12px;padding:12px;margin-top:15px}
@media(max-width:750px){.arena{grid-template-columns:1fr}#click{height:180px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">XVERDES</div><div class="online" id="status">● Offline</div></header>

<section id="lobby" class="card">
<h1>Xverdes</h1><p class="muted">Batalha de Tornados</p>
<input id="name" placeholder="Seu nome" maxlength="18">

<label class="small">Modo de Jogo:</label>
<select id="gameMode">
  <option value="multiplayer">Multiplayer Online (Até 5v5)</option>
  <option value="solo">Modo Solo (Treino & Skins)</option>
</select>

<div id="multiControls">
  <input id="room" placeholder="Código da sala (ex.: VERDE)">
  <label class="small">Tamanho dos Times:</label>
  <select id="teamSize">
    <option value="1">1v1</option>
    <option value="2">2v2</option>
    <option value="3">3v3</option>
    <option value="5">5v5</option>
  </select>
  <div class="row">
    <button id="create">Criar sala</button>
    <button id="join">Entrar na sala</button>
  </div>
</div>

<div id="soloControls" class="hidden">
  <button id="startSolo" class="mode-btn">Jogar Solo 🎯</button>
</div>

<div class="inventory">
  <div class="small">Skins Desbloqueadas: <span id="skinCount">1</span></div>
  <select id="skinSelect">
    <option value="skin-default">Tornado Padrão 🟢</option>
  </select>
</div>
</section>

<section id="game" class="screen hidden">
<div class="arena">
  <div class="team-container" id="teamA"></div>
  <div>
    <div id="click">🖱️<br><span id="clickLabel">Clique para ganhar pontos</span></div>
    <div id="feed">Aguardando...</div>
  </div>
  <div class="team-container" id="teamB"></div>
</div>
<div class="controls" id="actionControls">
  <button data-type="pequeno" data-cost="25">🌪️ Pequeno — 25</button>
  <button data-type="medio" data-cost="100">🌪️ Médio — 100</button>
  <button data-type="grande" data-cost="300">🌪️ Grande — 300</button>
</div>
<div style="text-align:center;margin-top:15px">
  <button id="leaveBtn">Sair da Partida</button>
</div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let me=null, isSolo=false, soloClicks=0, equippedSkin="skin-default";
const unlockedSkins = ["skin-default"];
const skinNames = {
  "skin-default": "Tornado Padrão 🟢",
  "skin-galaxy": "Tornado Galaxy 🌌",
  "skin-emerald": "Tornado Emerald 💎",
  "skin-inferno": "Tornado Inferno 🔥",
  "skin-gold": "Tornado Gold 👑"
};

const $=id=>document.getElementById(id);

$("gameMode").onchange = (e) => {
  if(e.target.value === "solo"){
    $("multiControls").classList.add("hidden");
    $("soloControls").classList.remove("hidden");
  } else {
    $("multiControls").classList.remove("hidden");
    $("soloControls").classList.add("hidden");
  }
};

$("skinSelect").onchange = (e) => { equippedSkin = e.target.value; };

socket.on("connect",()=>{ $("status").textContent="● Conectado"; });
socket.on("disconnect",()=>{ $("status").textContent="● Desconectado"; });

function join(){
  const name=$("name").value.trim()||"Jogador";
  const room=$("room").value.trim().toUpperCase();
  const maxPerTeam=$("teamSize").value;
  socket.emit("join_room",{name, roomId:room, maxPerTeam: parseInt(maxPerTeam)});
}
$("create").onclick=()=>{ if(!$("room").value.trim()) $("room").value=Math.random().toString(36).slice(2,8).toUpperCase(); join(); };
$("join").onclick=join;

// Modo Solo
$("startSolo").onclick=()=>{
  isSolo=true;
  $("lobby").classList.add("hidden"); $("game").classList.remove("hidden");
  $("actionControls").classList.add("hidden");
  $("clickLabel").textContent="Cliques no Solo: 0 / 100";
  $("feed").textContent="Modo Solo Active! A cada 100 cliques ganhe uma Skin!";
  $("teamA").innerHTML=`<div class="player"><div class="name">${$("name").value.trim()||'Jogador'}</div></div>`;
  $("teamB").innerHTML="";
};

$("click").onclick=()=>{
  if(isSolo){
    soloClicks++;
    $("clickLabel").textContent=`Cliques no Solo: ${soloClicks} / 100`;
    spawnTornado({size:50, skin:equippedSkin});
    if(soloClicks % 100 === 0){
      unlockRandomSkin();
    }
  } else {
    socket.emit("click");
  }
};

function unlockRandomSkin(){
  const allSkins = ["skin-galaxy", "skin-emerald", "skin-inferno", "skin-gold"];
  const locked = allSkins.filter(s => !unlockedSkins.includes(s));
  if(locked.length === 0){
    $("feed").textContent = "🎉 Você já possui todas as skins!";
    return;
  }
  const won = locked[Math.floor(Math.random() * locked.length)];
  unlockedSkins.push(won);
  $("skinCount").textContent = unlockedSkins.length;
  
  const opt = document.createElement("option");
  opt.value = won;
  opt.textContent = skinNames[won];
  $("skinSelect").appendChild(opt);
  
  alert(`🎉 PARABÉNS! Você ganhou a skin: ${skinNames[won]}`);
}

socket.on("joined",data=>{
  isSolo=false;
  me=data.player;
  $("lobby").classList.add("hidden"); $("game").classList.remove("hidden");
  $("actionControls").classList.remove("hidden");
  $("clickLabel").textContent="Clique para ganhar pontos";
});

function render(data){
  if(isSolo) return;
  const teamA = data.players.filter(p => p.team === 'A');
  const teamB = data.players.filter(p => p.team === 'B');
  
  const renderTeam = (list) => list.map(p => `
    <div class="player">
      <div class="name">${p.name}</div>
      <div class="hp"><div class="bar" style="width:${p.hp}%"></div></div>
      <div class="points">${p.points} pts</div>
    </div>
  `).join('');

  $("teamA").innerHTML = renderTeam(teamA);
  $("teamB").innerHTML = teamB.length ? renderTeam(teamB) : '<div class="player"><div class="name">Aguardando time rival...</div></div>';
  
  const mine = data.players.find(p => p.id === me?.id);
  if(mine) me = {...me, ...mine};
  document.querySelectorAll("#actionControls button").forEach(x => x.disabled = !mine || mine.points < +x.dataset.cost);
}

socket.on("room_state", render);
socket.on("players_update", render);

document.querySelectorAll("#actionControls button").forEach(btn => {
  btn.onclick = () => socket.emit("summon", { type: btn.dataset.type, skin: equippedSkin });
});

function spawnTornado(t){
  const el = document.createElement("div");
  el.className = `tornado ${t.skin || 'skin-default'}`;
  el.textContent = "🌪️";
  el.style.setProperty("--size", (t.size||50) + "px");
  el.style.setProperty("--x", (25 + Math.random() * 50) + "vw");
  el.style.setProperty("--y", (35 + Math.random() * 30) + "vh");
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

socket.on("tornado", t => {
  spawnTornado(t);
  $("feed").textContent = "🌪️ Tornado lançado na arena!";
});

socket.on("battle_start", () => $("feed").textContent = "⚔️ BATALHA INICIADA!");
socket.on("battle_end", d => $("feed").textContent = "🏆 " + d.winnerText + " venceu a batalha!");
socket.on("error_message", m => alert(m));

$("leaveBtn").onclick = () => location.reload();
</script>
</body>
</html>
